site_name: Omnist Spec
site_description: Language-agnostic specification for Omnist's Document model, Schema model, OML/OSD, and Schema Algebra.
site_url: https://spec.omnist.dev/
repo_url: https://github.com/omnist-dev/omnist-spec
repo_name: omnist-dev/omnist-spec
edit_uri: edit/master/docs/

docs_dir: docs

# Anchor validation is deliberately an error, not a warning. Stale
# cross-references were the most common defect found in this spec's 2026-09
# quality audit: a citation that resolves to a section which no longer says
# what the citing text claims is invisible to both readers and reviewers.
# mkdocs does not check anchors by default, so every `#anchor` in the docs
# went unverified -- a broken one was reported as INFO and the build passed.
# `warn` is the strongest level this option accepts; under `--strict` a
# warning aborts the build, which is why check.yml's docs-build job runs
# `mkdocs build --strict` on every pull request. Before that job existed,
# nothing in CI built the docs at all: docs.yml deploys with `gh-deploy`,
# without `--strict`, and only after merge.
#
# Note the limit of this gate: it validates markdown links that carry an
# anchor. A bare prose citation like "see 6.3" is invisible to it, and that
# is exactly how the wrong-section reference in this PR's own first draft
# got through.
validation:
  links:
    anchors: warn

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - 1. Glossary: 01-glossary.md
  - Operations & Models Reference: operations-and-models-reference.md
  - 2. Document Model: 02-document-model.md
  - 3. Schema Model: 03-schema-model.md
  - 4. OML Grammar: 04-oml-grammar.md
  - 5. OSD Grammar: 05-osd-grammar.md
  - 6. Schema Algebra: 06-schema-algebra.md
  - 7. Codecs & Deserialization: 07-codecs-and-deserialization.md
  - Format Codecs:
      - Overview: formats/overview.md
      - JSON: formats/json.md
      - YAML: formats/yaml.md
      - TOML: formats/toml.md
      - XML: formats/xml.md
      - OML: formats/oml.md
  - Real-World Examples: examples/index.md
  - 8. Conformance & Errors: 08-conformance-and-errors.md
  - OML/OSD Conformance Harness: conformance-harness.md
  - Porting a Conformance Runner: porting-a-conformance-runner.md
  - 9. Divergence Ledger: 09-divergence-ledger.md
  - 10. Governance & Versioning: 10-governance-and-versioning.md
  - Extensions:
      - Overview: extensions/overview.md
      - OSD-OML: extensions/osd-oml.md
